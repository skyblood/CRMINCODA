services:
  mongo:
    image: mongo:7
    container_name: crmincoda-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: crm_incoda
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: crmincoda-app
    restart: unless-stopped
    ports:
      - "8743:3001"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/crm_incoda
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
